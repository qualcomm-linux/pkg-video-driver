name: Promote New Upstream Version (Suites)

# Promote a new upstream version to all Debian/Ubuntu packaging suites simultaneously.
# Covers: qcom/debian/latest (unstable), qcom/debian/trixie, qcom/ubuntu/resolute.
# Can be triggered manually via workflow_dispatch, or automatically via
# repository_dispatch from the upstream video-driver repository when a new tag is pushed.
#
# Architecture:
# - promote-latest uses the standard reusable workflow for qcom/debian/latest.
#   This also imports the upstream tag into upstream/latest and pushes it.
# - post-promote-latest updates the changelog and enables auto-merge for the
#   qcom/debian/latest PR.
# - promote-suites uses a matrix strategy to promote qcom/debian/trixie and
#   qcom/ubuntu/resolute in parallel.
# - For each target branch, detect whether the new upstream tag is a no-op
#   relative to the most recently promoted upstream tag already merged into
#   that branch:
#   - if no-op: update changelog/version only
#   - if real upstream content changed: follow the normal branch logic

on:
  workflow_dispatch:
    inputs:
      upstream-tag:
        description: The upstream tag to promote. Eg, v1.1.0 or 1.2.0
        type: string
        required: true

  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: promote-upstream-suites-${{ github.repository }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.upstream-tag || inputs.upstream-tag }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1: Promote qcom/debian/latest via the standard reusable workflow.
  # This job also handles importing the upstream tag into upstream/latest and
  # pushing the upstream/<version> tag to the repo.
  # ─────────────────────────────────────────────────────────────────────────────
  promote-latest:
    uses: qualcomm-linux/qcom-build-utils/.github/workflows/pkg-promote-reusable-workflow.yml@main
    with:
      qcom-build-utils-ref: main
      debian-branch: qcom/debian/latest
      upstream-tag: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.upstream-tag || inputs.upstream-tag }}
      upstream-repo: ${{ vars.UPSTREAM_REPO_GITHUB_NAME }}
    secrets:
      PAT: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1b: Post-processing for the qcom/debian/latest PR created by
  # promote-latest.
  #
  # - Updates changelog entry to include the version number for traceability.
  # - Ensures there is an OPEN PR for the latest branch:
  #   - if no PR exists, create one
  #   - if an old PR exists but is CLOSED, create a new one
  # - Detects whether the new upstream tag is a no-op relative to the latest
  #   upstream tag already merged into qcom/debian/latest.
  # - If no-op, rebuild the PR branch from qcom/debian/latest and keep only the
  #   changelog/version update.
  # - If not no-op, preserve the reusable workflow merge history.
  # - Uses --match-head-commit to prevent merging a stale PR head.
  # - Leaves the PR open for manual resolution if a real rebase conflict occurs.
  # ─────────────────────────────────────────────────────────────────────────────
  post-promote-latest:
    needs: promote-latest
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/qualcomm-linux/pkg-builder:noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
      UPSTREAM_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.upstream-tag || inputs.upstream-tag }}
    steps:
      - name: Checkout package repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          path: ./package-repo
          fetch-depth: 0

      - name: Update changelog entry and enable auto-merge for qcom/debian/latest PR
        working-directory: ./package-repo
        run: |
          set -euo pipefail

          NORMALIZED_VERSION=$(echo "$UPSTREAM_TAG" | sed 's/^v//')
          PR_BRANCH="debian/pr/${NORMALIZED_VERSION}-1"
          DEFAULT_BASE_BRANCH="qcom/debian/latest"
          NEW_UPSTREAM_TAG="upstream/${NORMALIZED_VERSION}"

          echo "ℹ️ PR branch: $PR_BRANCH"

          git config user.name "${{ vars.DEB_PKG_BOT_CI_NAME }}"
          git config user.email "${{ vars.DEB_PKG_BOT_CI_EMAIL }}"

          # Fetch and checkout PR branch safely using explicit remote tracking.
          for i in 1 2 3; do
            if git fetch origin "$PR_BRANCH"; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "❌ git fetch origin $PR_BRANCH failed after 3 attempts"
              exit 1
            fi
            echo "⚠️ git fetch origin $PR_BRANCH failed (attempt $i), retrying in 5s..."
            sleep 5
          done
          git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"

          # Update changelog entry to include the version number for traceability.
          sed -i "s/\* New upstream release$/\* New upstream release ${NORMALIZED_VERSION}./" debian/changelog

          git add debian/changelog
          if git diff --cached --quiet; then
            echo "ℹ️ No changes needed (changelog already has version)"
          else
            git commit -s -m "debian: add version to changelog entry for traceability"
          fi

          # Ensure an OPEN PR exists for this branch.
          PR_STATE=""
          PR_NUMBER=""
          BASE_BRANCH="$DEFAULT_BASE_BRANCH"

          for i in 1 2 3 4 5; do
            PR_INFO=$(gh pr list \
              --repo "${{ github.repository }}" \
              --head "$PR_BRANCH" \
              --state all \
              --json state,baseRefName,number \
              --jq '.[0] // empty' 2>/dev/null || true)

            PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
            PR_BASE=$(echo "$PR_INFO" | jq -r '.baseRefName // empty')
            PR_NUM=$(echo "$PR_INFO" | jq -r '.number // empty')

            if [ -n "$PR_STATE" ]; then
              echo "✅ PR found (state: $PR_STATE, attempt $i)"
              if [ -n "$PR_BASE" ]; then
                BASE_BRANCH="$PR_BASE"
              fi
              if [ -n "$PR_NUM" ]; then
                PR_NUMBER="$PR_NUM"
              fi
              break
            fi

            echo "⚠️ PR not found yet (attempt $i), waiting 5s..."
            sleep 5
          done

          if [ "$PR_STATE" = "OPEN" ]; then
            echo "ℹ️ Using existing OPEN PR (base: $BASE_BRANCH)"
          else
            echo "⚠️ PR is not OPEN (state: ${PR_STATE:-NONE}), creating a new PR"

            gh pr create \
              --repo "${{ github.repository }}" \
              --title "Promotion to ${NORMALIZED_VERSION}" \
              --body "Automated promotion of upstream version ${NORMALIZED_VERSION} (tag: \`${UPSTREAM_TAG}\`) to branch \`${DEFAULT_BASE_BRANCH}\`." \
              --base "$DEFAULT_BASE_BRANCH" \
              --head "$PR_BRANCH"

            PR_VISIBLE=false
            for i in 1 2 3 4 5; do
              PR_INFO=$(gh pr list \
                --repo "${{ github.repository }}" \
                --head "$PR_BRANCH" \
                --state open \
                --json state,baseRefName,number \
                --jq '.[0] // empty' 2>/dev/null || true)

              PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
              PR_BASE=$(echo "$PR_INFO" | jq -r '.baseRefName // empty')
              PR_NUM=$(echo "$PR_INFO" | jq -r '.number // empty')

              if [ "$PR_STATE" = "OPEN" ]; then
                PR_VISIBLE=true
                if [ -n "$PR_BASE" ]; then
                  BASE_BRANCH="$PR_BASE"
                fi
                if [ -n "$PR_NUM" ]; then
                  PR_NUMBER="$PR_NUM"
                fi
                echo "✅ Newly created PR is now visible (attempt $i)"
                break
              fi

              echo "⚠️ Newly created PR not visible yet (attempt $i), waiting 5s..."
              sleep 5
            done

            if [ "$PR_VISIBLE" = "false" ]; then
              echo "❌ New PR was created but is still not visible after retries"
              exit 1
            fi
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Failed to resolve PR number"
            exit 1
          fi

          echo "ℹ️ Base branch: $BASE_BRANCH"

          # Fetch base branch and tags
          for i in 1 2 3; do
            if git fetch origin "$BASE_BRANCH" --tags; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "❌ git fetch origin $BASE_BRANCH failed after 3 attempts"
              exit 1
            fi
            echo "⚠️ git fetch origin $BASE_BRANCH failed (attempt $i), retrying in 5s..."
            sleep 5
          done

          # Per-branch no-op detection:
          # compare the new upstream tag to the latest upstream tag already merged
          # into qcom/debian/latest.
          NOOP_UPSTREAM=false
          PREV_UPSTREAM_TAG=$(
            git tag --merged "origin/$BASE_BRANCH" 'upstream/*' --sort=-version:refname \
              | grep -v "^${NEW_UPSTREAM_TAG}$" \
              | head -n1 || true
          )

          if git rev-parse -q --verify "refs/tags/${NEW_UPSTREAM_TAG}" >/dev/null 2>&1 && \
             [ -n "$PREV_UPSTREAM_TAG" ]; then
            NEW_SHA=$(git rev-list -n1 "${NEW_UPSTREAM_TAG}")
            PREV_SHA=$(git rev-list -n1 "${PREV_UPSTREAM_TAG}")

            echo "ℹ️ Previous promoted upstream tag on $BASE_BRANCH: $PREV_UPSTREAM_TAG"
            echo "ℹ️ New upstream tag: $NEW_UPSTREAM_TAG"
            echo "ℹ️ Previous upstream SHA: $PREV_SHA"
            echo "ℹ️ New upstream SHA: $NEW_SHA"

            if [ "$NEW_SHA" = "$PREV_SHA" ]; then
              NOOP_UPSTREAM=true
              echo "✅ Detected no-op upstream tag on $BASE_BRANCH: same commit as previous promoted tag"
            fi
          else
            echo "ℹ️ Could not determine previous upstream tag on $BASE_BRANCH; continuing with normal flow"
          fi

          if [ "$NOOP_UPSTREAM" = "true" ]; then
            # Strategy 2 for latest:
            # rebuild PR branch from latest base branch and keep only changelog update
            echo "ℹ️ Rebuilding latest PR branch from base branch for changelog-only update"

            git fetch origin "$BASE_BRANCH" "$PR_BRANCH"

            # Preserve the current changelog content
            cp debian/changelog /tmp/debian.changelog.preserved

            # Recreate PR branch from latest base branch
            git checkout -B "$PR_BRANCH" "origin/$BASE_BRANCH"

            # Restore changelog and recommit if needed
            cp /tmp/debian.changelog.preserved debian/changelog
            git add debian/changelog

            if git diff --cached --quiet; then
              echo "ℹ️ No changelog delta to commit after branch rebuild"
            else
              git commit -s -m "debian: add version to changelog entry for traceability"
            fi

            git push --force-with-lease origin "$PR_BRANCH"
          else
            # Real upstream change:
            # preserve reusable workflow history.
            # Push the changelog update first so it is preserved even if rebase conflicts.
            git push --force-with-lease origin "$PR_BRANCH"

            echo "ℹ️ Rebasing latest PR branch onto base branch"
            if git rebase "origin/$BASE_BRANCH"; then
              echo "✅ Rebase successful"
              git push --force-with-lease origin "$PR_BRANCH"
            else
              echo "⚠️ Rebase hit a real conflict; leaving PR open for manual resolution"
              git rebase --abort || true
              exit 0
            fi
          fi

          # Enable auto-merge
          for i in 1 2 3; do
            HEAD_COMMIT=$(git rev-parse HEAD)
            echo "ℹ️ Enabling auto-merge (attempt $i, head: $HEAD_COMMIT)"
            if gh pr merge "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --auto --merge \
              --match-head-commit "$HEAD_COMMIT"; then
              echo "✅ Auto-merge enabled"
              exit 0
            fi

            echo "⚠️ Auto-merge failed (attempt $i), refreshing branch..."
            git fetch origin "$BASE_BRANCH" "$PR_BRANCH" || { echo "⚠️ fetch failed, skipping this round"; sleep 2; continue; }
            git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"

            if git rebase "origin/$BASE_BRANCH"; then
              git push --force-with-lease origin "$PR_BRANCH"
            else
              echo "⚠️ Rebase conflict during auto-merge retry; leaving PR open for manual resolution"
              git rebase --abort || true
              exit 0
            fi

            sleep 2
          done

          echo "⚠️ Failed to enable auto-merge after retries, leaving PR open for manual merge"
          exit 0

  # ─────────────────────────────────────────────────────────────────────────────
  # Steps 2 & 3: Promote qcom/debian/trixie and qcom/ubuntu/resolute in parallel
  # after promote-latest completes.
  #
  # A matrix strategy replaces the former promote-trixie / promote-resolute
  # duplicate jobs, halving the YAML size while keeping identical behaviour.
  #
  # Uses unique PR branch names:
  #   debian/pr/qcom-debian-trixie/<version>-1
  #   debian/pr/qcom-ubuntu-resolute/<version>-1
  #
  # Auto-merge is best-effort: if the target branch has no branch protection
  # rules we warn and leave the PR open rather than failing the workflow.
  # --match-head-commit prevents merging a stale head.
  # ─────────────────────────────────────────────────────────────────────────────
  promote-suites:
    needs: promote-latest
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        debian-branch:
          - qcom/debian/trixie
          - qcom/ubuntu/resolute
    container:
      image: ghcr.io/qualcomm-linux/pkg-builder:noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      DEBIAN_BRANCH: ${{ matrix.debian-branch }}
      UPSTREAM_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.upstream-tag || inputs.upstream-tag }}
      GH_TOKEN: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
    steps:
      - name: Checkout qcom-build-utils (for merge_debian_packaging_upstream script)
        uses: actions/checkout@v6
        with:
          repository: qualcomm-linux/qcom-build-utils
          ref: main
          path: ./qcom-build-utils
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Checkout package repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          path: ./package-repo
          fetch-depth: 0

      - name: Compute normalized version and PR branch name
        run: |
          set -euo pipefail
          NORMALIZED_VERSION=$(echo "$UPSTREAM_TAG" | sed 's/^v//')
          SAFE_DEBIAN_BRANCH=$(echo "$DEBIAN_BRANCH" | tr '/' '-')
          PR_BRANCH="debian/pr/${SAFE_DEBIAN_BRANCH}/${NORMALIZED_VERSION}-1"
          echo "NORMALIZED_VERSION=$NORMALIZED_VERSION" >> "$GITHUB_ENV"
          echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"
          echo "ℹ️ Upstream tag      : $UPSTREAM_TAG"
          echo "ℹ️ Normalized version: $NORMALIZED_VERSION"
          echo "ℹ️ PR branch         : $PR_BRANCH"

      - name: Fetch upstream tag from upstream repo
        working-directory: ./package-repo
        run: |
          set -euo pipefail
          if ! git remote get-url upstream-source >/dev/null 2>&1; then
            git remote add upstream-source \
              "https://x-access-token:${{ secrets.DEB_PKG_BOT_CI_TOKEN }}@github.com/${{ vars.UPSTREAM_REPO_GITHUB_NAME }}.git"
          fi
          git fetch upstream-source "+refs/tags/*:refs/tags/*"

      - name: Create or reset PR branch and merge upstream
        working-directory: ./package-repo
        run: |
          set -euo pipefail
          git config user.name "${{ vars.DEB_PKG_BOT_CI_NAME }}"
          git config user.email "${{ vars.DEB_PKG_BOT_CI_EMAIL }}"
          git fetch origin "$DEBIAN_BRANCH" --tags

          # Safely checkout the debian branch using explicit remote tracking.
          git checkout -B "$DEBIAN_BRANCH" "origin/$DEBIAN_BRANCH"

          # Delete local PR branch if it exists (idempotency for re-runs).
          if git show-ref --verify --quiet "refs/heads/${{ env.PR_BRANCH }}"; then
            git branch -D "${{ env.PR_BRANCH }}"
          fi

          git checkout -b "${{ env.PR_BRANCH }}"

          NEW_UPSTREAM_TAG="upstream/${{ env.NORMALIZED_VERSION }}"
          PREV_UPSTREAM_TAG=$(
            git tag --merged "origin/$DEBIAN_BRANCH" 'upstream/*' --sort=-version:refname \
              | grep -v "^${NEW_UPSTREAM_TAG}$" \
              | head -n1 || true
          )

          NOOP_UPSTREAM=false

          if git rev-parse -q --verify "refs/tags/${NEW_UPSTREAM_TAG}" >/dev/null 2>&1 && \
             [ -n "$PREV_UPSTREAM_TAG" ]; then
            NEW_SHA=$(git rev-list -n1 "${NEW_UPSTREAM_TAG}")
            PREV_SHA=$(git rev-list -n1 "${PREV_UPSTREAM_TAG}")

            echo "ℹ️ Previous promoted upstream tag on $DEBIAN_BRANCH: $PREV_UPSTREAM_TAG"
            echo "ℹ️ New upstream tag: $NEW_UPSTREAM_TAG"
            echo "ℹ️ Previous upstream SHA: $PREV_SHA"
            echo "ℹ️ New upstream SHA: $NEW_SHA"

            if [ "$NEW_SHA" = "$PREV_SHA" ]; then
              NOOP_UPSTREAM=true
              echo "✅ Detected no-op upstream tag for $DEBIAN_BRANCH"
            fi
          else
            echo "ℹ️ Could not determine previous upstream tag on $DEBIAN_BRANCH; treating as normal promotion"
          fi

          if [ "$NOOP_UPSTREAM" = "true" ]; then
            echo "ℹ️ No upstream content change detected; keeping PR branch as changelog-only for $DEBIAN_BRANCH"
          else
            if ! ../qcom-build-utils/scripts/merge_debian_packaging_upstream "$UPSTREAM_TAG"; then
              echo "❌ merge_debian_packaging_upstream failed for tag $UPSTREAM_TAG on branch $DEBIAN_BRANCH"
              exit 1
            fi
          fi

      - name: Promote changelog
        working-directory: ./package-repo
        run: |
          set -euo pipefail
          export DEBFULLNAME="${{ vars.DEB_PKG_BOT_CI_NAME }}"
          export DEBEMAIL="${{ vars.DEB_PKG_BOT_CI_EMAIL }}"
          dch \
            --distribution=UNRELEASED \
            --newversion="${{ env.NORMALIZED_VERSION }}-1" \
            "New upstream release ${{ env.NORMALIZED_VERSION }}."
          git commit -a -s -m "Update changelog version to ${{ env.NORMALIZED_VERSION }}-1 and UNRELEASED suite"

      - name: Push PR branch
        working-directory: ./package-repo
        run: |
          set -euo pipefail
          git push --force-with-lease origin "${{ env.PR_BRANCH }}"

      - name: Create PR if needed
        working-directory: ./package-repo
        run: |
          set -euo pipefail
          PR_INFO=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ env.PR_BRANCH }}" \
            --state all \
            --json state,number \
            --jq '.[0] // empty' 2>/dev/null || true)
          PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number // empty')

          if [ "$PR_STATE" = "OPEN" ]; then
            echo "ℹ️ PR already exists and is open for branch ${{ env.PR_BRANCH }} (#${PR_NUMBER})"
          else
            if [ -n "$PR_STATE" ]; then
              echo "ℹ️ Previous PR for branch ${{ env.PR_BRANCH }} is $PR_STATE, creating a new one"
            fi
            gh pr create \
              --repo "${{ github.repository }}" \
              --title "Promotion to ${{ env.NORMALIZED_VERSION }} ($DEBIAN_BRANCH)" \
              --body "Automated promotion of upstream version ${{ env.NORMALIZED_VERSION }} (tag: \`$UPSTREAM_TAG\`) to branch \`$DEBIAN_BRANCH\`." \
              --base "$DEBIAN_BRANCH" \
              --head "${{ env.PR_BRANCH }}"

            PR_VISIBLE=false
            for i in 1 2 3 4 5; do
              PR_INFO=$(gh pr list \
                --repo "${{ github.repository }}" \
                --head "${{ env.PR_BRANCH }}" \
                --state open \
                --json state,number \
                --jq '.[0] // empty' 2>/dev/null || true)
              PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
              PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number // empty')
              if [ "$PR_STATE" = "OPEN" ]; then
                echo "✅ PR is now visible (#${PR_NUMBER})"
                PR_VISIBLE=true
                break
              fi
              echo "⚠️ PR not visible yet (attempt $i), waiting 5s..."
              sleep 5
            done

            if [ "$PR_VISIBLE" = "false" ]; then
              echo "❌ PR was created but is still not visible after retries"
              exit 1
            fi
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Failed to resolve PR number"
            exit 1
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Enable auto-merge when supported
        working-directory: ./package-repo
        run: |
          HEAD_COMMIT=$(git rev-parse HEAD)
          set +e
          gh pr merge "${{ env.PR_NUMBER }}" \
            --repo "${{ github.repository }}" \
            --auto --merge \
            --match-head-commit "$HEAD_COMMIT"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "⚠️ Auto-merge was not enabled for $DEBIAN_BRANCH."
            echo "⚠️ This usually means protected branch rules / required checks are not configured for the base branch."
            echo "⚠️ The PR was created successfully and left open for manual merge or future auto-merge enablement."
          else
            echo "✅ Auto-merge enabled for $DEBIAN_BRANCH"
          fi